plugins { id 'com.android.application' }

android {
    namespace 'ru.gam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gam.citygarage'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
