plugins { id 'com.android.application' }

android {
    namespace 'ru.gam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gam.citygarage.release'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }
}
