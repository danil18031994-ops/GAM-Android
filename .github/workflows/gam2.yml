name: GAM 2.0 Flutter Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'gam2/**'
      - '.github/workflows/gam2.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/gam_app
          flutter create --platforms=android --org com.gam.citygarage --project-name gam_app build/gam_app
          cp gam2/pubspec.yaml build/gam_app/pubspec.yaml
          rm -rf build/gam_app/lib
          cp -R gam2/lib build/gam_app/lib
          rm -rf build/gam_app/test
          cp gam2/android/AndroidManifest.xml build/gam_app/android/app/src/main/AndroidManifest.xml
          mkdir -p build/gam_app/android/app/src/main/res/drawable
          cp gam2/android/gam_icon.xml build/gam_app/android/app/src/main/res/drawable/gam_icon.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/gam_app/android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          p.write_text(s)
          PY

      - name: Resolve packages
        working-directory: build/gam_app
        run: flutter pub get

      - name: Analyze
        working-directory: build/gam_app
        run: flutter analyze

      - name: Build release APK
        working-directory: build/gam_app
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/gam_app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/GAM-2.0-demo.apk
          ls -lh out/GAM-2.0-demo.apk
          sha256sum out/GAM-2.0-demo.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install out/GAM-2.0-demo.apk
            adb shell pm list packages | grep -F "com.gam.citygarage.gam_app"
            adb shell monkey -p com.gam.citygarage.gam_app -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -F "com.gam.citygarage.gam_app" | head -20

      - name: Upload GAM 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: GAM-2.0-demo-install-tested
          path: out/GAM-2.0-demo.apk
          if-no-files-found: error
          retention-days: 30
