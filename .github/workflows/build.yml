name: Build and Install-Test GAM Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          PASS="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"

          keytool -genkeypair -v             -keystore gam-release.jks             -storepass "$PASS"             -keypass "$PASS"             -alias gam             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=GAM Test Release, OU=GAM, O=City Garage, C=RU"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" GAM-1.5-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks gam-release.jks             --ks-key-alias gam             --ks-pass pass:"$PASS"             --key-pass pass:"$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out GAM-1.5-release.apk             GAM-1.5-aligned.apk

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="GAM-1.5-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.gam.citygarage.release'" badging.txt
          grep -F "versionCode='15'" badging.txt
          grep -F "versionName='1.5.0'" badging.txt
          grep -F "targetSdkVersion:'35'" badging.txt
          grep -F "launchable-activity: name='ru.gam.app.MainActivity'" badging.txt
          ls -lh "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and launch release APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install GAM-1.5-release.apk
            adb shell pm path com.gam.citygarage.release
            adb shell am start -W -n com.gam.citygarage.release/ru.gam.app.MainActivity
            sleep 3
            adb shell dumpsys activity activities | grep -F "com.gam.citygarage.release" | head -20

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GAM-1.5-release-install-tested
          path: GAM-1.5-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5-phone-test --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.5-phone-test GAM-1.5-release.apk             --title "GAM 1.5 Phone Test"             --notes "Install-tested release APK for direct phone download."
